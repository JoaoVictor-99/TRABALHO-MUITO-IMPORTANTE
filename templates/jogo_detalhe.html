{% extends "base.html" %}

{% block title %}{{ jogo.nome }} - GamesHub Edu{% endblock %}

{% block content %}
<a href="{{ url_for('catalogo') }}">Voltar ao catalogo</a>

<h1>{{ jogo.nome }}</h1>
<p>{{ jogo.categoria }} - Faixa etaria: {{ jogo.faixa_etaria }}</p>
<p>{{ jogo.descricao }}</p>

<a href="{{ url_for('jogar_jogo', jogo_id=jogo.id) }}" class="botao">Jogar</a>
{% endblock %}
